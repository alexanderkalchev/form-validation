<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./index.js" defer></script>
  </head>
  <body>
    <form novalidate>
      <div class="email-wrapper">
        <label for="email">Email</label>
        <input type="email" id="email" required />
        <span class="error-msg"></span>
      </div>
      <div class="country-wrapper">
        <label for="country">Country</label>
        <select name="country" id="country">
          <option value="default" selected>--Choose a country--</option>
          <option value="germany">Germany</option>
          <option value="bulgaria">Bulgaria</option>
          <option value="uk">United Kingdom</option>
          <option value="france">France</option>
          <option value="netherlands">The Netherlands</option>
          <option value="spain">Spain</option>
        </select>
      </div>
      <div class="postal-code-wrapper">
        <label for="postal-code">Postal code</label>
        <input
          type="text"
          minlength="4"
          maxlength="4"
          id="postal-code"
          required
        />
        <span class="error-msg"></span>
      </div>
      <div class="password-wrapper">
        <label for="password">Password</label>
        <input
          type="password"
          minlength="6"
          maxlength="30"
          id="password"
          required
        />
        <span class="error-msg"></span>
      </div>
      <div class="password-repeat-wrapper">
        <label for="password-repeat">Repeat password</label>
        <input type="password" id="password-repeat" required />
        <span class="error-msg"></span>
      </div>
      <button id="submit-button">Submit</button>
    </form>
  </body>
</html>
